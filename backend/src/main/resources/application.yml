spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  ai:
    openai:
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      # 建议用环境变量注入：set AI_API_KEY=你的硅基流动 key
      api-key: ${AI_API_KEY:you-key}
      base-url: https://api.siliconflow.cn

# 服务器配置
server:
  port: 1236

# JWT配置
jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWT2025!@#$%^&*()_+SecureKeyHere}
  expiration: 86400000        # 24 小时（毫秒）
  refresh-expiration: 604800000  # 7 天（毫秒）
  header: Authorization       # token 头部名称
  token-prefix: "Bearer "     # token 前缀
